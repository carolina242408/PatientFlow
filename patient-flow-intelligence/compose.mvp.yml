# Backend demonstration stack, without frontend or fixed container names.
# docker compose -f compose.mvp.yml -p patientflow-mvp up -d --build
services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfi
      POSTGRES_PASSWORD: ${MVP_DB_PASSWORD:-patientflow-demo}
      POSTGRES_DB: pfi
    volumes:
      - mvp-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfi -d patientflow"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_DB_USERNAME: pfi
      KC_DB_PASSWORD: ${MVP_DB_PASSWORD:-patientflow-demo}
      KC_HOSTNAME: http://localhost:${MVP_KEYCLOAK_PORT:-19080}
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MVP_KEYCLOAK_ADMIN_PASSWORD:-patientflow-demo}
    ports:
      - "127.0.0.1:${MVP_KEYCLOAK_PORT:-19080}:8080"
    volumes:
      - ./keycloak/demo:/opt/keycloak/data/import:ro
    depends_on:
      postgresql: {condition: service_healthy}
  algorithms:
    build: ./algorithms
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      DB_URL: jdbc:postgresql://postgresql:5432/patientflow
      DB_USERNAME: pfi
      DB_PASSWORD: ${MVP_DB_PASSWORD:-patientflow-demo}
      KEYCLOAK_ISSUER_URI: http://localhost:${MVP_KEYCLOAK_PORT:-19080}/realms/patientflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/patientflow/protocol/openid-connect/certs
      ALGORITHMS_URL: http://algorithms:8000
      WS_ALLOWED_ORIGINS: http://localhost:${MVP_API_PORT:-18080}
    ports:
      - "127.0.0.1:${MVP_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 30
    depends_on:
      postgresql: {condition: service_healthy}
      keycloak: {condition: service_started}
      algorithms: {condition: service_started}
volumes:
  mvp-postgres:
