# Patient Flow Intelligence — infraestrutura de desenvolvimento
# Uso: docker compose up -d
# Só infra: docker compose up -d postgresql keycloak
# Frontend e backend correm em containers.

name: patient-flow-intelligence

services:
  # ------------------------------------------------------------
  # Base de dados principal (backend + Keycloak + TimescaleDB)
  # ------------------------------------------------------------
  postgresql:
    image: timescale/timescaledb:latest-pg16
    container_name: postgresql
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pfi-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Keycloak (OAuth2/OIDC) — realm "patientflow", tema custom
  # ------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    command: [ "start", "--import-realm" ]
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_HTTPS_CERTIFICATE_FILE: "/opt/keycloak/certs/localhostCertificate.pem"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/opt/keycloak/certs/localhostKey.pem"
    ports:
      - "9080:8443"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/theme:/opt/keycloak/themes:ro
      - ./certs:/opt/keycloak/certs
    depends_on:
      postgresql:
        condition: service_healthy

  # ------------------------------------------------------------
  # Algoritmos (Python/FastAPI)
  # ------------------------------------------------------------
  algorithms:
    build: ./algorithms
    container_name: algorithms
    environment:
      KUMO_DEVICE: cpu
      KUMO_CONTEXT_ROWS: ${KUMO_CONTEXT_ROWS:-4096}
    volumes:
      - type: bind
        source: ./algorithms/datasetgenerator/ml_hospital_consumption_87k.csv
        target: /data/context.csv
        read_only: true
        bind:
          create_host_path: false
    networks:
      - algorithms-private
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)" ]
      interval: 15s
      timeout: 10s
      start_period: 10m
      retries: 5

  # ------------------------------------------------------------
  # Gerador de Dados Sintéticos (Python/FastAPI - HL7 v2.5 + FHIR R4)
  # ------------------------------------------------------------
  data-generator:
    build:
      context: ../tools/data-generation
      dockerfile: ./Dockerfile
    container_name: pfi-data-generator
    ports:
      - "8001:8001"
    volumes:
      - ../tools/data-generation/pfgen:/app/pfgen:ro
      - ../tools/data-generation/config:/app/config:ro
      - ../tools/data-generation/ui:/app/ui:ro
      - ../tools/data-generation/output:/app/output
      - ../tools/data-generation/.cache:/app/.cache
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Backend Spring Boot
  # ------------------------------------------------------------
  backend:
    build: ./backend
    container_name: backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgresql:5432/patientflow
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://localhost:9080/realms/patientflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/patientflow/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      ALGORITHMS_URL: http://algorithms:8000
      ALGORITHMS_DISCHARGE_TIMEOUT: ${ALGORITHMS_DISCHARGE_TIMEOUT:-30s}
      DATA_GENERATOR_URL: http://data-generator:8001
      HAPI_FHIR_URL: ${HAPI_FHIR_URL:-http://hapi-fhir:8081/fhir}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      INGESTION_SOURCES: ${INGESTION_SOURCES:-http://data-generator:8001/api/hl7/live?delay_ms=500&loop=true}
      AUDIT_LOG_TTL_DAYS: ${AUDIT_LOG_TTL_DAYS:-30}
      AUDIT_CLEANUP_CRON: ${AUDIT_CLEANUP_CRON:-0 0 * * * *}
      WS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    networks:
      - default
      - algorithms-private
    ports:
      - "8080:8080"
    volumes:
      - ../tools/hl7-fhir-converter:/app/converter:ro
    healthcheck:
      test: [ "CMD", "java", "-cp", "/app", "Healthcheck" ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_started
      algorithms:
        condition: service_healthy
      hapi-fhir-server:
        condition: service_started

  # ------------------------------------------------------------
  # RabbitMQ (mensagens entre serviços)
  # ------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    env_file: .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pfi-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Redis (cache)
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - pfi-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # HAPI FHIR (dados clínicos) + base de dados dedicada
  # ------------------------------------------------------------
  hapi-fhir-postgres:
    image: postgres:16-alpine
    container_name: hapi-postgres
    environment:
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
      POSTGRES_DB: hapi
    ports:
      - "5433:5432"
    volumes:
      - pfi-hapi-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hapi" ]
      interval: 10s
      timeout: 5s
      retries: 5

  hapi-fhir-server:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir
    ports:
      - "8081:8081"
    environment:
      spring.datasource.url: jdbc:postgresql://hapi-fhir-postgres:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.password: hapi
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      server.port: 8081
      hapi.fhir.server_address: http://localhost:8081/fhir
      hapi.fhir.tester.home.server_address: http://localhost:8081/fhir
      hapi.fhir.fhir_version: R4
      hapi.fhir.default_encoding: json
      hapi.fhir.allow_multiple_delete: "true"
      hapi.fhir.expunge_enabled: "true"
    depends_on:
      hapi-fhir-postgres:
        condition: service_healthy

  # # ------------------------------------------------------------
  # # MinIO (armazenamento S3)
  # # ------------------------------------------------------------
  # minio:
  #   image: pgsty/silo:latest
  #   container_name: minio
  #   command: server /data --console-address ":9001"
  #   env_file: .env
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - pfi-minio-data:/data
  #   healthcheck:
  #     test: [ "CMD", "mc", "ready", "local" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------
  ui:
    image: patientflow-ui:latest
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: ui
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started

networks:
  default:
  algorithms-private:
    internal: true

volumes:
  pfi-postgres-data:
  pfi-hapi-data:
  pfi-rabbitmq-data:
  pfi-redis-data:
  pfi-minio-data:
