# Patient Flow Intelligence — infraestrutura de desenvolvimento
# Uso: docker compose up -d
# Só infra: docker compose up -d postgresql keycloak
# Frontend (npm run dev) e backend (./mvnw spring-boot:run) correm localmente.

name: patient-flow-intelligence

services:
  # ------------------------------------------------------------
  # Base de dados principal (backend + Keycloak)
  # ------------------------------------------------------------
  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pfi-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Keycloak (OAuth2/OIDC) — realm "patientflow", tema custom
  # ------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    ports:
      - "9080:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/theme:/opt/keycloak/themes:ro
    depends_on:
      postgresql:
        condition: service_healthy

  # ------------------------------------------------------------
  # Algoritmos (Python/FastAPI)
  # ------------------------------------------------------------
  algorithms:
    build: ./algorithms
    container_name: pfi-algorithms
    ports:
      - "8000:8000"

  # ------------------------------------------------------------
  # RabbitMQ (mensagens entre serviços)
  # ------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    env_file: .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pfi-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Redis (cache)
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - pfi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # HAPI FHIR (dados clínicos) + base de dados dedicada
  # ------------------------------------------------------------
  hapi-fhir-postgres:
    image: postgres:16-alpine
    container_name: hapi-postgres
    environment:
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
      POSTGRES_DB: hapi
    ports:
      - "5433:5432"
    volumes:
      - pfi-hapi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  hapi-fhir-server:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir
    ports:
      - "8081:8080"
    environment:
      spring.datasource.url: jdbc:postgresql://hapi-fhir-postgres:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.password: hapi
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      hapi.fhir.default_encoding: json
      hapi.fhir.allow_multiple_delete: "true"
      hapi.fhir.expunge_enabled: "true"
    depends_on:
      hapi-fhir-postgres:
        condition: service_healthy

  # ------------------------------------------------------------
  # MinIO (armazenamento S3)
  # ------------------------------------------------------------
  minio:
    image: pgsty/silo:latest
    container_name: minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pfi-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------
  ui:
    image: patientflow-frontend:1.0
    container_name: ui
    ports:
      - "5173:80"
    build: ./frontend
    volumes:
      - ./frontend:/app
    depends_on:
      keycloak:
        condition: service_started

volumes:
  pfi-postgres-data:
  pfi-hapi-data:
  pfi-rabbitmq-data:
  pfi-redis-data:
  pfi-minio-data:
