    los: { mean: 5.0, sd: 4.0 }      # duração da passagem pela UCI
    elective_share: 0.0
    age: { mean: 65, sd: 15 }
    mortality: 0.20
    readmission_30d: 0.05
    admissions_per_day: 0.9          # admissões diretas da urgência (as restantes chegam por transferência)
    step_down_to: MED                # após alta da UCI o doente segue para este serviço
