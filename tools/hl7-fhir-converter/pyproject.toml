[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7-fhir-converter"
version = "0.1.0"
description = "HL7 v2.x ADT to FHIR R4 Bundle Converter for PatientFlow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
hl7-fhir-converter = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["models*"]
